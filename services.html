<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الخدمات الالكترونية</title>


  <link rel="stylesheet" href="css/tailwind.min.css" />
  <link rel="stylesheet" href="css/remixicon.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/search-responsive.css?v=3" />
  <style>
    .low-power *,
    .low-power *::before,
    .low-power *::after {
      animation: none !important;
      transition: none !important;
      box-shadow: none !important;
      text-shadow: none !important;
      filter: none !important;
      transform: none !important;
      backdrop-filter: none !important;
    }

    .services-page .services-site-card {
      background: rgba(14, 165, 233, .10) !important;
      border-color: rgba(2, 132, 199, .28) !important;
    }

    @media (max-width: 768px) {
      .services-page .services-site-card .services-site-icon {
        width: 56px !important;
        height: 56px !important;
      }

      .services-page .services-site-card .services-site-icon>i {
        font-size: 1.6rem !important;
      }

      .services-page .services-site-card .site-title {
        font-size: 1.1rem !important;
        line-height: 1.4 !important;
      }

      .services-page .services-site-card .site-subtitle {
        display: none !important;
      }

      .services-page .services-site-card .site-subtitle.site-subtitle-ai {
        display: block !important;
      }
    }

    @media (min-width: 769px) {
      .services-page .services-site-card {
        border-color: rgba(2, 132, 199, .42) !important;
        box-shadow: 0 10px 26px rgba(2, 132, 199, .12) !important;
      }

      .services-page {
        height: 100vh;
        overflow: hidden;
      }

      .services-page main {
        overflow: hidden;
      }

      .services-page main>.container {
        padding-right: 0 !important;
        padding-left: 0 !important;
      }

      .services-page #modal-container {
        padding: 0 !important;
      }

      .services-page #modal-content {
        padding: 0 !important;
      }
    }

    /* Mobile sidebar behavior */
    @media (max-width: 768px) {
      #modal-content .services-container {
        position: relative;
      }

      #modal-content #services-sidebar {
        position: fixed;
        top: 48px;
        right: -105%;
        bottom: 0;
        width: min(90vw, 360px);
        max-width: 100vw;
        background: #111827;
        border-left: 2px solid rgba(14, 165, 233, .45);
        box-shadow: -8px 0 24px rgba(0, 0, 0, .2);
        z-index: 60;
        transition: right .25s ease;
        overflow-y: auto !important;
        padding-bottom: 12px;
      }

      #sidebar-toggle:checked~main #modal-content #services-sidebar {
        right: 0;
      }

      #sidebar-toggle:checked~main #modal-content::before {
        content: "";
        position: fixed;
        top: 48px;
        right: 0;
        bottom: 0;
        left: 0;
        background: rgba(0, 0, 0, .35);
        z-index: 55;
      }
    }

    #modal-content #services-sidebar {
      background: #111827;
      border-left-color: rgba(14, 165, 233, .45);
    }

    .services-page #services-sidebar {
      color: rgba(255, 255, 255, .92);
    }

    .services-page #services-sidebar .services-sidebar-card {
      background: rgba(15, 23, 42, .78);
      border-color: rgba(148, 163, 184, .18) !important;
    }

    .services-page #services-sidebar .services-sidebar-card .services-sidebar-heading {
      color: rgba(255, 255, 255, .94);
    }

    .services-page #services-sidebar .services-sidebar-input,
    .services-page #services-sidebar .services-sidebar-select {
      background: rgba(255, 255, 255, .08);
      border-color: rgba(148, 163, 184, .28) !important;
      color: rgba(255, 255, 255, .92);
    }

    .services-page #services-sidebar .services-sidebar-select {
      color-scheme: dark;
      background: #0f172a;
    }

    .services-page #services-sidebar .services-sidebar-select option {
      background: #ffffff !important;
      color: #0f172a !important;
    }

    .services-page #services-sidebar .services-sidebar-input::placeholder {
      color: rgba(226, 232, 240, .78);
    }

    .services-page #services-sidebar .services-sidebar-divider {
      border-color: rgba(148, 163, 184, .16) !important;
    }

    .services-add-btn:hover {
      background: #000000 !important;
    }

    .services-site-card:hover {
      background: #0284c7 !important;
      border-color: #0284c7 !important;
    }

    .services-site-card:hover .site-title {
      color: #ffffff !important;
    }

    .services-site-card:hover .site-url {
      color: rgba(255, 255, 255, 0.78) !important;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col low-power text-sm bg-white services-page">

  <header class="fixed top-0 left-0 right-0 z-40 px-2 py-0.5 bg-blue-900 border-b border-blue-900">
    <div class="w-full">
      <div class="grid grid-cols-3 items-center">
        <div class="justify-self-start">
          <button id="back-to-main"
            class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-transparent border border-white/20 rounded-full shadow-sm text-white hover:bg-white/10 text-sm">
            <i class="ri-arrow-right-line text-white text-sm"></i>
            <span class="text-white">الرئيسيه</span>
          </button>
        </div>

        <div class="justify-self-center">
          <button id="copyable-title"
            class="inline-flex items-center gap-1 px-2 py-0.5 bg-transparent border border-white/20 rounded-full shadow-sm text-white hover:bg-white/10 text-sm font-semibold"
            title="اضغط للنسخ">
            <i class="ri-global-line text-white text-sm"></i>
            <span class="text-sm font-semibold text-white" id="page-title">الخدمات الالكترونية</span>
          </button>
        </div>

        <div class="justify-self-end"></div>
      </div>
    </div>
  </header>

  <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-checkbox" />
  <label for="sidebar-toggle" class="mobile-sidebar-toggle" title="القائمة">
    <i class="ri-arrow-left-s-line open-icon"></i>
    <i class="ri-arrow-right-s-line close-icon"></i>
  </label>

  <main class="flex-1 p-0 pt-8 bg-white">
    <div class="container mx-auto px-0 sm:px-4 py-0 max-w-full">
      <div class="bg-white rounded-none shadow-none border-0 p-0 min-h-screen">
        <div id="services-content-container">
          <div id="modal-container" class="p-0 sm:p-6" data-lock-size="true">
            <div class="hidden">
              <button id="modal-close-button"></button>
              <h2 id="modal-title"></h2>
            </div>
            <div id="modal-content" class="text-gray-600"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="modal" class="fixed inset-0 bg-black/60 hidden z-50 overflow-y-auto">
    <div class="flex items-start justify-center min-h-screen py-2 px-2">
      <div id="modal-popup-container" class="bg-white rounded-lg max-w-7xl w-[95vw] my-4">
        <div class="flex justify-between items-center mb-2 px-4 py-3 border-b border-gray-200">
          <button id="modal-popup-close-button" class="text-gray-500">
            <i class="ri-close-line text-xl"></i>
          </button>
          <h2 id="modal-popup-title" class="text-lg font-semibold text-gray-800"></h2>
        </div>
        <div id="modal-popup-content" class="px-4 pb-4"></div>
      </div>
    </div>
  </div>


  <div id="toast-container"></div>


  <script src="js/state.js"></script>
  <script src="js/db.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/autocomplete.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/header.js"></script>
  <script src="js/services.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      try {
        await initDB();

        if (window.stateManager && typeof stateManager.setModalHistory === 'function') {
          stateManager.setModalHistory([]);
          stateManager.pushToModalHistory({ func: displayServicesModal, args: [] });
        }
        await displayServicesModal();

        const backToMainBtn = document.getElementById('back-to-main');
        if (backToMainBtn) {
          backToMainBtn.addEventListener('click', function () {
            window.location.href = 'index.html';
          });
        }

        const closeBtn = document.getElementById('modal-close-button');
        if (closeBtn) {
          closeBtn.addEventListener('click', function () {
            const title = (document.getElementById('modal-title')?.textContent || '').trim();
            const inForm = title.includes('تعديل') || title.includes('إضافة');
            if (inForm && typeof navigateBack === 'function') {
              navigateBack();
            } else {
              window.location.href = 'index.html';
            }
          });
        }
      } catch (e) {
        console.error(e);
        alert('تعذر فتح نافذة الخدمات الالكترونية');
      }
    });
  </script>
</body>

</html>
